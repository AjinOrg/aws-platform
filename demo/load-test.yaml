# DEMO: load test for dev. CPU load on my-app → HPA adds pods → pods Pending → Karpenter adds a Spot node →
# load stops → HPA removes pods → Karpenter removes the empty node. Watch it in Grafana (my-app dashboard).
#
#   kubectl apply -f demo/load-test.yaml        # starts 3 generator pods for 10 minutes
#   kubectl delete -f demo/load-test.yaml       # afterwards (also removes the two NetworkPolicies)
#
# Compliant on purpose: it runs in "dev" under the same rules as the app (Kyverno: ECR image, pinned tag, non-root,
# requests + memory limit, probes; Pod Security "restricted"). No extra image: the generator is the my-app image
# (distroless Node.js) running a small script instead of the app.
# dev has default-deny network policies (only the ALB may reach my-app), so this file opens generator → my-app:8080
# for the duration of the test. These objects are not in Git: ArgoCD does not track or prune them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: load-test-egress
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: load-test
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: my-app
      ports:
        - protocol: TCP
          port: 8080 # policies see the pod port (the Service's port 80 is translated to 8080 first)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-load-test
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: my-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: load-test
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: dev
spec:
  parallelism: 3 # 3 generator pods
  completions: 3
  backoffLimit: 0 # a failed generator is not restarted: this is a demo, not a service
  activeDeadlineSeconds: 900 # hard stop after 15 min, whatever happens
  ttlSecondsAfterFinished: 1800 # the finished Job and its logs are removed after 30 min
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-test
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role: apps # same Spot nodes as the app (adds to the capacity Karpenter must provide)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: generator
          image: 471112815218.dkr.ecr.ap-south-1.amazonaws.com/my-app:d521095 # the image dev runs (ECR, pinned)
          env:
            - { name: TARGET, value: "http://my-app.dev.svc.cluster.local/dev" }
            - { name: CONCURRENCY, value: "64" } # open requests per pod, on kept-alive connections
            - { name: DURATION_SECONDS, value: "600" }
          # The image's entrypoint is node; "-e" runs this script instead of the app
          args:
            - -e
            - |
              const http = require('node:http');
              const target = process.env.TARGET;
              const concurrency = Number(process.env.CONCURRENCY);
              const end = Date.now() + Number(process.env.DURATION_SECONDS) * 1000;
              const agent = new http.Agent({ keepAlive: true, maxSockets: concurrency });
              let ok = 0, errors = 0;
              // health endpoint for the probes (required by Kyverno require-probes)
              http.createServer((req, res) => res.end('ok')).listen(8081);
              function hit() {
                if (Date.now() > end) return;
                http.get(target, { agent }, (res) => {
                  res.resume();
                  res.on('end', () => { res.statusCode === 200 ? ok++ : errors++; hit(); });
                }).on('error', () => { errors++; setTimeout(hit, 100); });
              }
              for (let i = 0; i < concurrency; i++) hit();
              console.log(JSON.stringify({ msg: 'load started', target, concurrency }));
              const report = setInterval(() => {
                console.log(JSON.stringify({ requestsPerSecond: Math.round(ok / 10), errors }));
                ok = 0; errors = 0;
                if (Date.now() > end) { clearInterval(report); console.log('{"msg":"load finished"}'); process.exit(0); }
              }, 10000);
          ports:
            - { name: health, containerPort: 8081 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 64Mi }
            limits: { memory: 128Mi } # no CPU limit (as the platform's policy allows): it may use spare CPU
          livenessProbe: { httpGet: { path: /healthz, port: health }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /healthz, port: health }, periodSeconds: 10 }
