# DEMO: deliberately non-compliant. Expected result: REJECTED (image from Docker Hub, not ECR).
# Try: kyverno apply policies/kyverno --resource demo/bad-registry.yaml      (CI check)
#      kubectl apply -f demo/bad-registry.yaml                               (cluster, once policies are enforced)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-registry }
  template:
    metadata:
      labels: { app: bad-registry }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: docker.io/library/nginx:1.27
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
