# Alerts for my-app and its capacity. Picked up by Prometheus (ruleSelectorNilUsesHelmValues: false).
# Shown in Alertmanager and Grafana; no external receiver (Slack/email) in the POC.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app
  namespace: monitoring
spec:
  groups:
    - name: my-app
      rules:
        - alert: MyAppDown
          expr: kube_deployment_status_replicas_available{deployment="my-app", namespace=~"dev|staging|production"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "my-app has no available pods in {{ $labels.namespace }}"
            description: "Deployment my-app in {{ $labels.namespace }} has had 0 available replicas for 2 minutes."

        - alert: MyAppHPAAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="my-app"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="my-app"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "my-app in {{ $labels.namespace }} is at its maximum replicas"
            description: "The HPA has been at maxReplicas for 10 minutes: raise maxReplicas or check the load."

        - alert: MyAppHighRestarts
          expr: increase(kube_pod_container_status_restarts_total{container="my-app", namespace=~"dev|staging|production"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "my-app pod {{ $labels.pod }} restarts often"
            description: "More than 3 restarts in 15 minutes in {{ $labels.namespace }}: check the logs (Grafana → Loki)."

    - name: capacity
      rules:
        - alert: KarpenterNodePoolNearLimit
          # vCPUs of the nodes Karpenter launched for NodePool "apps" vs. its limit of 16 (nodepool.yaml)
          expr: |
            sum(
              kube_node_status_capacity{resource="cpu"}
              * on(node) group_left() kube_node_labels{label_karpenter_sh_nodepool="apps"}
            ) > 12
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Karpenter NodePool apps uses more than 12 of its 16 vCPU limit"
            description: "New application pods may stay Pending soon: raise the NodePool limit or reduce load."
