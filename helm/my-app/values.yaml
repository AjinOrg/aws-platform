# Defaults for every environment. Per-environment values: gitops/apps/my-app/values-<env>.yaml

environment: dev # shown by the app; also used in names and paths

image:
  repository: 471112815218.dkr.ecr.ap-south-1.amazonaws.com/my-app
  tag: "" # required: the image tag (git commit SHA), set per environment by the app pipeline
  pullPolicy: IfNotPresent

containerPort: 8080

serviceAccount:
  name: my-app
  # IRSA role (Terraform, module iam). Starts with no AWS permissions; add only what the app needs
  roleArn: arn:aws:iam::471112815218:role/platform-dev-my-app

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  maxUnavailable: 1 # works for 1 replica too (minAvailable: 1 would block node drains)

# Application pods run on the Spot nodes Karpenter creates (NodePool "apps")
nodeSelector:
  node-role: apps

# Secrets: External Secrets copies one Secrets Manager entry (JSON) into the Kubernetes Secret "my-app";
# each JSON key becomes a file under mountPath. The app reads the files on every use, so changes arrive
# without a restart (mounted as a whole volume, never with subPath).
secrets:
  enabled: true
  secretsManagerKey: platform-dev/my-app/dev
  storeName: aws-secrets-manager
  refreshInterval: 10m # poll Secrets Manager every 10 min: 3 ExternalSecrets = ~13k API calls/month (~$0.07), ~2 MB/day via NAT
  mountPath: /etc/my-app/secrets

# One shared ALB for all environments (IngressGroup "my-app"): one load balancer instead of three.
# Without a domain, environments are told apart by path: http://<alb-dns>/dev, /staging, /production
ingress:
  enabled: true
  groupName: my-app
  groupOrder: 10
  path: /dev
  healthcheckPath: /readyz
