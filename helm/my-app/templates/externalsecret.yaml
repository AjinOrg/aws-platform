{{- if .Values.secrets.enabled }}
# Copies the Secrets Manager entry (JSON) into the Kubernetes Secret "my-app": one key per JSON field.
# The value lives only in AWS; this file holds only its name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.storeName }}
  target:
    name: my-app
    creationPolicy: Owner # the Secret is deleted together with this ExternalSecret
  dataFrom:
    - extract:
        key: {{ .Values.secrets.secretsManagerKey }}
{{- end }}
