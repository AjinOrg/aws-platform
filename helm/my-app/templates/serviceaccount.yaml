apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
  annotations:
    # IRSA: pods using this service account get short-lived credentials for this role
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
# The app does not call the Kubernetes API: no API token in the pod (IRSA uses its own token)
automountServiceAccountToken: false
