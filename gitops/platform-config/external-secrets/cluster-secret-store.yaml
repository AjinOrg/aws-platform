# One store for the whole cluster: "AWS Secrets Manager in ap-south-1".
# No auth block: the operator uses its own IRSA role (platform-dev-external-secrets), so no keys are stored.
# Only the application namespaces may use it; an ExternalSecret anywhere else is refused.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
  conditions:
    - namespaces:
        - dev
        - staging
        - production
