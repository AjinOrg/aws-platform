# Default StorageClass: encrypted gp3 EBS volumes, created by the EBS CSI driver (EKS add-on, Terraform).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true" # AWS-managed key aws/ebs
  fsType: ext4
reclaimPolicy: Delete # deleting the PVC deletes the EBS volume (no orphaned volumes after a stop)
allowVolumeExpansion: true # grow a volume later by editing the PVC size
# Create the volume only when a pod needs it, in that pod's Availability Zone (EBS volumes are zonal)
volumeBindingMode: WaitForFirstConsumer
