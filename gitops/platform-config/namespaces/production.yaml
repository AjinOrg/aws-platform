# Namespace "production" for the application, with its security baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    # Pod Security Admission: pods must run as non-root, drop capabilities, no privilege escalation, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# 1. Deny everything in and out by default; the policies below open only what is needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Every pod may look up names (CoreDNS in kube-system); without this nothing can resolve a hostname
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: production
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. The load balancer (in the public subnets 10.0.96.0/24-10.0.98.0/24) may reach the services on their port.
#    Every service behind the ALB is listed here (a new service in helm-chart also needs a line: no 502s from day one).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-load-balancer
  namespace: production
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [my-app, orders]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.96.0/22
      ports:
        - protocol: TCP
          port: 8080
---
# 4. Service to service: orders may call my-app (egress from orders) ...
#    Port 8080 = the pod port: the policy sees traffic after the Service (port 80) has forwarded it to a pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-my-app
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: my-app
      ports:
        - protocol: TCP
          port: 8080
---
# 5. ... and my-app accepts it (ingress to my-app). Both sides are needed with default-deny in both directions.
#    Only this direction is opened: my-app cannot call orders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-my-app-from-orders
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: my-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders
      ports:
        - protocol: TCP
          port: 8080
