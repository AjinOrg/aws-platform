# Namespace "dev" for the application, with its security baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    # Pod Security Admission: pods must run as non-root, drop capabilities, no privilege escalation, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# 1. Deny everything in and out by default; the policies below open only what is needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: dev
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Every pod may look up names (CoreDNS in kube-system); without this nothing can resolve a hostname
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: dev
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. The load balancer (in the public subnets 10.0.96.0/24-10.0.98.0/24) may reach the app on its port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-load-balancer
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: my-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.96.0/22
      ports:
        - protocol: TCP
          port: 8080
