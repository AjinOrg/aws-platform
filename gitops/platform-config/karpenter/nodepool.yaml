# WHICH nodes Karpenter may launch for application pods, and the limits.
# Application pods select these nodes with nodeSelector "node-role: apps" (Helm chart, Day 5).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps
spec:
  template:
    metadata:
      labels:
        node-role: apps
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"] # POC/Dev: Spot (60-90% cheaper). Production: on-demand
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"] # several families = more Spot pools = fewer interruptions
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"] # small nodes for a POC
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        # At least ~4 GiB memory and no nano/micro/small sizes: Karpenter picks the cheapest instance that fits the
        # pods' requests, and 1 GiB micro nodes were too small for Grafana and the monitoring stack
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["3500"] # MiB
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"]
      expireAfter: 168h # replace every node at least weekly (fresh, patched image)
  # Hard ceiling: Karpenter will not launch beyond this, whatever is requested.
  # 16 vCPU: my-app (dev/staging/production) + the monitoring stack (Step 14). 8 was too low: Grafana could not
  # get a node in its volume's Availability Zone. Only capacity actually used costs money (consolidation).
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized # remove empty nodes, repack pods onto fewer nodes
    consolidateAfter: 5m # 1m repacked pods too often; stateful monitoring pods also opt out (do-not-disrupt)
