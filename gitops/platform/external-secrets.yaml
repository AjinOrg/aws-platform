# External Secrets Operator: copies secrets from AWS Secrets Manager into Kubernetes Secrets.
# AWS access through IRSA: role platform-dev-external-secrets (Terraform, module iam), which may read only
# the three app secrets platform-dev/my-app/{dev,staging,production} and use only their KMS key.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ghcr.io/external-secrets/charts
    chart: external-secrets
    targetRevision: 2.12.0
    helm:
      valuesObject:
        installCRDs: true
        global:
          nodeSelector:
            node-role: system # controller, webhook and cert controller on the system nodes
        serviceAccount:
          create: true
          name: external-secrets # must match the IRSA trust: external-secrets:external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::471112815218:role/platform-dev-external-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # large CRDs
