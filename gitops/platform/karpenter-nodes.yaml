# Which nodes Karpenter may launch: plain manifests in gitops/platform-config/karpenter/.
# Separate from the chart because they need Karpenter's CRDs to exist first: until then the sync fails and
# is retried automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io # deleting this app deletes the NodePool -> Karpenter removes its nodes
spec:
  project: platform
  source:
    repoURL: https://github.com/AjinOrg/aws-platform.git
    targetRevision: main
    path: gitops/platform-config/karpenter
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # the CRDs may not exist yet on the first sync
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
