# Microservices: the infra team decides WHERE services may run (AppProject "apps"); the release team decides WHAT
# runs, in AjinOrg/helm-chart (shared chart + values per service and environment).
#
# One ApplicationSet creates one Application per service and environment ("<service>-<env>", e.g. my-app-dev):
#   every folder apps/<service>/  ×  every file environments/<env>.yaml   (both in AjinOrg/helm-chart, branch main)
# A new service is a new folder in helm-chart: no change here. A new environment also needs a namespace and a
# destination below, so it always comes through this repository.
---
# Project "apps": stricter than "platform". Only the helm-chart repository, only the three app namespaces,
# only the object kinds the chart creates, and nothing cluster-wide.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Application workloads (charts and values owned by the release team in AjinOrg/helm-chart)
  sourceRepos:
    - https://github.com/AjinOrg/helm-chart.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev
    - server: https://kubernetes.default.svc
      namespace: staging
    - server: https://kubernetes.default.svc
      namespace: production
  clusterResourceWhitelist: [] # no cluster-wide objects (namespaces, CRDs, cluster roles...)
  namespaceResourceWhitelist:
    - { group: "", kind: ServiceAccount }
    - { group: "", kind: Service }
    - { group: apps, kind: Deployment }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: external-secrets.io, kind: ExternalSecret }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # .app.path.basename = service name (folder name)
          - git:
              repoURL: https://github.com/AjinOrg/helm-chart.git
              revision: main
              directories:
                - path: apps/*
              pathParamPrefix: app
          # .environment and .chartRevision = content of environments/<env>.yaml
          - git:
              repoURL: https://github.com/AjinOrg/helm-chart.git
              revision: main
              files:
                - path: environments/*.yaml
              pathParamPrefix: envfile # two Git generators in one matrix need different prefixes
  # Deleting THIS ApplicationSet (a bad PR, a revert) must never take every service down with it.
  # Removing one service folder in helm-chart still removes that service (finalizer below).
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{ .app.path.basename }}-{{ .environment }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io # removing a service folder removes the service (and its ALB rule)
    spec:
      project: apps
      sources:
        # The shared chart, at the version this environment pins...
        - repoURL: https://github.com/AjinOrg/helm-chart.git
          targetRevision: "{{ .chartRevision }}"
          path: charts/microservice
          helm:
            releaseName: "{{ .app.path.basename }}" # the chart names every object after the release
            valueFiles:
              - "$values/apps/{{ .app.path.basename }}/values.yaml"
              - "$values/apps/{{ .app.path.basename }}/values-{{ .environment }}.yaml"
        # ...with the service's values from main ("$values" refers to this source)
        - repoURL: https://github.com/AjinOrg/helm-chart.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .environment }}" # created by app-namespaces (Pod Security restricted, default-deny)
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
