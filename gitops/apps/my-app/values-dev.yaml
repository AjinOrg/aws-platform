# my-app in the dev namespace. image.tag is updated by the my-app release pipeline (pull request).
environment: dev
image:
  repository: docker.io/library/nginx # DEMO: not from ECR - Kyverno must reject
  tag: "d521095"
# Sized so the load test (demo/load-test.yaml) shows the whole chain: 10 replicas x 200m = 2 vCPU does not fit on
# the existing nodes, so Karpenter must add one. Staging/production keep the chart defaults (50m, max 3).
resources:
  requests:
    cpu: 200m
autoscaling:
  minReplicas: 1
  maxReplicas: 10
secrets:
  secretsManagerKey: platform-dev/my-app/dev
ingress:
  path: /dev
  groupOrder: 10
